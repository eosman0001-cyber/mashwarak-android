name: Show Mashwarak Firebase Signing Fingerprints

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore existing Mashwarak release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MASHWARAK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo 'Missing GitHub secret MASHWARAK_KEYSTORE_BASE64' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mashwarak-release-key.jks"
          chmod 600 "$RUNNER_TEMP/mashwarak-release-key.jks"
          echo 'b909765d511efd2d01b73376f279863f3ed42ec0a3bbed127867773410e9a581  '"$RUNNER_TEMP/mashwarak-release-key.jks" | sha256sum -c -

      - name: Print public SHA-1 and SHA-256 fingerprints
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MASHWARAK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MASHWARAK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo '=== Copy only these fingerprints to Firebase ==='
          keytool -list -v \
            -keystore "$RUNNER_TEMP/mashwarak-release-key.jks" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E 'SHA1:|SHA256:'

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/mashwarak-release-key.jks"
