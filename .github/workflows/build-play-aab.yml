name: Build Mashwarak Play AAB

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version MAJOR.MINOR.PATCH, e.g. 1.14.0. Use a new versionCode for every Play upload."
        required: true
        default: "1.14.0"

permissions:
  contents: read

concurrency:
  group: mashwarak-play-aab
  cancel-in-progress: false

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          VERSION="${VERSION#V}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use MAJOR.MINOR.PATCH, e.g. 1.14.0"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( 10#$MINOR > 999 || 10#$PATCH > 999 )); then
            echo "::error::MINOR and PATCH must be <= 999"
            exit 1
          fi
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "::error::Invalid versionCode"
            exit 1
          fi
          echo "MASHWARAK_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "MASHWARAK_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore existing release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MASHWARAK_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing MASHWARAK_KEYSTORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mashwarak-release-key.jks"
          echo "b909765d511efd2d01b73376f279863f3ed42ec0a3bbed127867773410e9a581  $RUNNER_TEMP/mashwarak-release-key.jks" | sha256sum -c -

      - name: Check required signing and Maps secrets
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MASHWARAK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MASHWARAK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MASHWARAK_KEY_PASSWORD }}
          MAPS_KEY: ${{ secrets.MASHWARAK_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$MAPS_KEY"; do
            if [[ -z "$value" ]]; then
              echo "::error::Missing a required release signing or Maps repository secret"
              exit 1
            fi
          done

      - name: Build signed Google Play AAB and run lint
        env:
          MASHWARAK_KEYSTORE_PATH: ${{ runner.temp }}/mashwarak-release-key.jks
          MASHWARAK_KEYSTORE_PASSWORD: ${{ secrets.MASHWARAK_KEYSTORE_PASSWORD }}
          MASHWARAK_KEY_ALIAS: ${{ secrets.MASHWARAK_KEY_ALIAS }}
          MASHWARAK_KEY_PASSWORD: ${{ secrets.MASHWARAK_KEY_PASSWORD }}
          MASHWARAK_VERSION_NAME: ${{ env.MASHWARAK_VERSION_NAME }}
          MASHWARAK_VERSION_CODE: ${{ env.MASHWARAK_VERSION_CODE }}
          MASHWARAK_MAPS_API_KEY: ${{ secrets.MASHWARAK_MAPS_API_KEY }}
        run: gradle :app:bundlePlayRelease :app:lintPlayRelease

      - name: Verify signed bundle and prepare output
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="app/build/outputs/bundle/playRelease/app-play-release.aab"
          test -s "$BUNDLE"
          unzip -tq "$BUNDLE"
          jarsigner -verify "$BUNDLE" | tee "$RUNNER_TEMP/aab_verify_result.txt"
          if ! grep -q "jar verified" "$RUNNER_TEMP/aab_verify_result.txt"; then
            echo "::error::AAB is not signed with a verifiable release certificate"
            exit 1
          fi
          unzip -l "$BUNDLE" | grep -q 'base/manifest/AndroidManifest.xml'
          OUTPUT="Mashwarak-Play-${MASHWARAK_VERSION_NAME}.aab"
          cp "$BUNDLE" "$OUTPUT"
          echo "OUTPUT_AAB=$OUTPUT" >> "$GITHUB_ENV"
          echo "Created signed Google Play AAB: $OUTPUT"

      - name: Upload Play AAB for manual Play Console upload
        uses: actions/upload-artifact@v4
        with:
          name: Mashwarak-Play-AAB
          path: ${{ env.OUTPUT_AAB }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove restored signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/mashwarak-release-key.jks"
