name: V350 Startup Diagnostics APK (isolated branch)

on:
  # Runs on the isolated branch; no workflow file needs to land on main.
  push:
    branches: [v350-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated diagnostic APK
        env:
          MASHWARAK_MAPS_API_KEY: ${{ secrets.MASHWARAK_MAPS_API_KEY }}
        run: gradle :app:assembleDiagnosticDebug
      - name: Upload diagnostic APK (never to Play)
        uses: actions/upload-artifact@v4
        with:
          name: Mashwarak-V350-Diagnostic-APK
          path: app/build/outputs/apk/diagnostic/debug/*.apk
